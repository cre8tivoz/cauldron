name: CI

# Cheap checks run on Linux for pull requests, release tags, and manual runs.
# Duplicate pushes to main are skipped (work lands via pull requests).
# The macOS build + unzip launch check runs only on release tags (v*) or manual
# workflow_dispatch, inside a single job with zero Actions artifact uploads so
# free-tier storage and macOS minutes are not burned on every PR push (WDL-256).
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.2
      - run: npm ci
        timeout-minutes: 5
      - run: npm run typecheck
        timeout-minutes: 5
      - run: npm run lint
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 10
      # Ubuntu 24.04 blocks the unprivileged namespaces Electron's sandbox
      # needs; allow them so the packaged app can open on this runner.
      - name: Allow Electron's sandbox on Ubuntu
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test (package and open the app hidden on Linux)
        run: xvfb-run -a npm run smoke
        timeout-minutes: 5

  mac-build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.2
      - run: npm ci
        timeout-minutes: 8
      - name: Build the Mac download
        run: npm run make
        timeout-minutes: 12
      - name: Unzip and launch the Mac download
        timeout-minutes: 5
        shell: python
        run: |
          import glob, os, pathlib, subprocess
          archive, = glob.glob('out/make/zip/darwin/arm64/*.zip')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Cauldron-first-launch'
          subprocess.run(['/usr/bin/ditto', '-x', '-k', archive, str(destination)], check=True)
          executable, = destination.glob('**/Cauldron.app/Contents/MacOS/Cauldron')
          subprocess.run([str(executable)], env={**os.environ, 'CAULDRON_SMOKE': '1'}, timeout=60, check=True)
