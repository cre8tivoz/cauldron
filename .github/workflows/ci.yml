name: CI

# Cheap checks run on Linux for every push to main and every pull request.
# The two macOS jobs cost about 10 times as much per minute, so they run only
# on pull requests that change more than docs, or when started by hand from
# the Actions tab (Run workflow). See WDL-245.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'originalresearch/**'
      - 'v1screenshots/**'
  pull_request:
    paths-ignore:
      - 'originalresearch/**'
      - 'v1screenshots/**'
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mac: ${{ steps.mac.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits so a pull request's merge commit can be compared with
          # its base to see which files changed.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.2
      - run: npm ci
        timeout-minutes: 5
      - run: npm run typecheck
        timeout-minutes: 5
      - run: npm run lint
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 10
      # Ubuntu 24.04 blocks the unprivileged namespaces Electron's sandbox
      # needs; allow them so the packaged app can open on this runner.
      - name: Allow Electron's sandbox on Ubuntu
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test (package and open the app hidden on Linux)
        run: xvfb-run -a npm run smoke
        timeout-minutes: 5
      - name: Decide whether the Mac jobs are needed
        id: mac
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) echo "mac=true" >> "$GITHUB_OUTPUT" ;;
            pull_request)
              # HEAD is the pull request's merge commit; HEAD^1 is the base.
              if git diff --name-only HEAD^1 HEAD \
                | grep -qvE '(\.md$|^docs/|^\.scratch/|^originalresearch/|^v1screenshots/)'; then
                echo "mac=true" >> "$GITHUB_OUTPUT"
              else
                echo "Docs-only pull request; skipping the Mac jobs."
                echo "mac=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *) echo "mac=false" >> "$GITHUB_OUTPUT" ;;
          esac

  mac-build:
    needs: check
    if: needs.check.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.2
      - run: npm ci
        timeout-minutes: 8
      - name: Build the Mac download
        run: npm run make
        timeout-minutes: 12
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Cauldron-Mac-${{ github.sha }}
          path: out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error
          retention-days: 7

  separate-mac-launch:
    needs: mac-build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Cauldron-Mac-${{ github.sha }}
          path: download
      - name: Unzip and launch the actual download on a fresh Mac
        timeout-minutes: 5
        shell: python
        run: |
          import glob, os, pathlib, subprocess
          archive, = glob.glob('download/*.zip')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Cauldron-first-launch'
          subprocess.run(['/usr/bin/ditto', '-x', '-k', archive, str(destination)], check=True)
          executable, = destination.glob('**/Cauldron.app/Contents/MacOS/Cauldron')
          subprocess.run([str(executable)], env={**os.environ, 'CAULDRON_SMOKE': '1'}, timeout=60, check=True)
